<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse</title>
  <style>
    /* Estilos para la página */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }

    h2 {
      color: #333;
      font-size: 1.5rem;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #2980b9;
    }

    p {
      color: #e74c3c;
      font-size: 0.9rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Registrarse</h2>
    <input type="name" id="name" placeholder="Nombre" required>
    <input type="email" id="email" placeholder="Correo" required>
    <input type="password" id="password" placeholder="Contraseña" required>
    <input type="password" id="confirmPassword" placeholder="Confirmar Contraseña" required>
    <button onclick="register()">Registrarse</button>
    <p id="message"></p>
  </div>

  <script>
    async function register() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();

      if (!name || !email || !password || !confirmPassword) {
    document.getElementById('message').innerText = 'Por favor, complete todos los campos.';
    return;
  }

  if (password !== confirmPassword) {
    document.getElementById('message').innerText = 'Las contraseñas no coinciden.';
    return;
  }

  try {
    const response = await fetch('http://localhost:3000/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password }),  // Enviar name junto con los demás datos
    });

    const result = await response.json();

    if (result.success) {
      document.getElementById('message').innerText = '¡Registro exitoso!';
      window.location.href = 'login.html';
    } else {
      document.getElementById('message').innerText = result.message || 'Error al registrarse';
    }
  } catch (error) {
    document.getElementById('message').innerText = 'Error en la conexión con el servidor';
    console.error('Error en la conexión con el servidor:', error);
  }
}
  </script>
</body>
</html>
