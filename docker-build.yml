name: Docker CI

on:
  push:
    branches:
      - develop  # Esta configuración hace que el flujo se ejecute cuando haya un "push" a la rama "develop"
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true  # Esto va a subir la imagen a Docker Hub, si tienes un repo configurado
          tags: username/portafolio-grupoc:latest

      - name: Run Docker container
        run: |
          docker run -d -p 3000:3000 username/portafolio-grupoc:latest
